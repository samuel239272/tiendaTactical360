<!doctype html>
<html>
  <head>
    <title>Local asset studio</title>
    <style>
      body {
        margin: 0;
        background: transparent;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      const renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setSize(900, 760);
      renderer.setPixelRatio(2);
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 900 / 760, 0.1, 50);
      scene.add(new THREE.AmbientLight('#e7ece1', 1.7));
      for (const [color, intensity, position] of [
        ['#fff0d5', 3.5, [3, 5, 5]],
        ['#dce8dc', 2.5, [-4, 3, -2]],
        ['#ffffff', 1, [2, 0, -5]],
      ]) {
        const light = new THREE.DirectionalLight(color, intensity);
        light.position.set(...position);
        scene.add(light);
      }
      let current;
      window.renderAsset = async (url, view) => {
        if (current) scene.remove(current);
        current = (await new GLTFLoader().loadAsync(url)).scene;
        scene.add(current);
        const position =
          view === 'side' ? [5, 0.7, 0.8] : view === 'rear' ? [-3, 1.6, -4.5] : [3.3, 1.9, 4.5];
        camera.position.set(...position);
        camera.lookAt(0, 0.05, 0);
        renderer.render(scene, camera);
        const output = document.createElement('canvas');
        output.width = 900;
        output.height = 760;
        output.getContext('2d').drawImage(renderer.domElement, 0, 0, 900, 760);
        return output.toDataURL('image/webp', 0.94);
      };
    </script>
  </body>
</html>
